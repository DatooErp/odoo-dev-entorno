# Entorno de desarrollo Odoo, independiente de cualquier otro compose del
# servidor: imagen, Postgres, ficheros y código propios. No publica puertos
# en el host; se accede por el túnel de Cloudflare.
name: odoo-dev

services:
  web:
    build: ./web
    image: odoo-dev-web:16.0
    container_name: odoo-dev-web
    restart: unless-stopped
    user: odoo
    entrypoint: ""
    command: ["odoo"]
    depends_on:
      - db
    mem_limit: 2g
    volumes:
      - ./conf:/etc/odoo:ro
      - odoo-dev-data:/var/lib/odoo
      - ./datoov16:/mnt/addons/datoov16:ro
      - ./modulos_github16:/mnt/addons/modulos_github16:ro
      # Código de las solicitudes en revisión, para probarlo aislado.
      - ./revision:/mnt/revision:ro

  db:
    image: postgres:13.0-alpine
    container_name: odoo-dev-db
    restart: unless-stopped
    mem_limit: 1g
    shm_size: 256m
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-dev-pgdata:/var/lib/postgresql/data/pgdata

  # Panel de control. Guarda los secretos del entorno, por eso va en su
  # propio contenedor y no en el de Odoo, donde corre código del cliente.
  panel:
    build: ./panel
    image: odoo-dev-panel
    container_name: odoo-dev-panel
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      - web
      - dockerproxy
    environment:
      - PANEL_PREFIX=${PANEL_PREFIX:-}
      - PANEL_SECRET_KEY=${PANEL_SECRET_KEY}
      # Primer usuario de Datoo; el resto se dan de alta desde el panel.
      - PANEL_DATOO_PASSWORD=${PANEL_DATOO_PASSWORD}
      - PANEL_DATOO_NAME=${PANEL_DATOO_NAME:-Datoo}
      - PANEL_DATOO_EMAIL=${PANEL_DATOO_EMAIL:-desarrollo@datoo.es}
      - ODOO_MASTER_PASSWORD=${ODOO_MASTER_PASSWORD}
      - PGPASSWORD=${PG_PASSWORD}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - ENV_NAME=${ENV_NAME:-Entorno de desarrollo}
      - DEV_DB=${DEV_DB:-}
      - ENV_SLUG=${ENV_SLUG:-entorno}
      - SOURCE_DIR=/entrada
      - SOURCE_SSH=${SOURCE_SSH:-}
      - SOURCE_DB=${SOURCE_DB:-}
      - GITHUB_REPO=${GITHUB_REPO:-DatooErp/datoov16}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - TERMINAL_SECRET=${TERMINAL_SECRET:-}
    # Grupo dueño de la carpeta de código, para preparar las solicitudes.
    group_add:
      - "10002"
    volumes:
      - odoo-dev-backups:/backups
      - odoo-dev-panel-data:/data
      - ./revision:/revision
      # Copias grandes que Datoo deja en el servidor para restaurarlas.
      - ./entrada:/entrada:ro
      # Solo lectura: el panel nunca ejecuta git sobre la carpeta compartida.
      - ./datoov16:/repos/datoov16:ro
      - ./modulos_github16:/repos/modulos_github16:ro
      # Claves que solo usa el panel: subir ramas a GitHub y pedir la copia
      # de producción. Los asistentes no las ven.
      - ./ssh-panel:/run/keys:ro
    networks:
      - default
      - control

  # Único acceso a Docker del entorno: solo deja reiniciar, leer el registro
  # y ejecutar comandos en odoo-dev-web y odoo-dev-asistentes. Nada más del servidor.
  dockerproxy:
    image: wollomatic/socket-proxy:1
    container_name: odoo-dev-dockerproxy
    restart: unless-stopped
    user: "65534:${DOCKER_GID}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    mem_limit: 64m
    command:
      - -loglevel=info
      - -listenip=0.0.0.0
      - -allowfrom=panel
      - -allowGET=^/v1\.[0-9]+/(containers/(odoo-dev-web|odoo-dev-asistentes)/(json|logs)|exec/[a-f0-9]+/json)$
      - -allowPOST=^/v1\.[0-9]+/(containers/(odoo-dev-web|odoo-dev-asistentes)/(restart|exec)|exec/[a-f0-9]+/start)$
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - control

  # Asistentes de desarrollo en sesión remota: Claude Code y Codex (ChatGPT).
  # Un puesto (usuario Unix) por usuario del panel, todos sobre ./datoov16;
  # modulos_github16 va en solo lectura.
  asistentes:
    build: ./asistentes
    image: odoo-dev-asistentes
    container_name: odoo-dev-asistentes
    # Nombre con el que el entorno aparece en la aplicación de ChatGPT.
    hostname: ${ENV_HOSTNAME:-odoo-dev}
    restart: unless-stopped
    init: true
    mem_limit: 4g
    # Solo las capacidades necesarias para lanzar cada proceso con el usuario
    # de su puesto; los procesos de los puestos no las heredan.
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges
    environment:
      # No cargar los conectores de la cuenta de Claude (correo, Drive, etc.).
      # Es una comodidad, no una barrera: usar cuentas sin conectores sensibles.
      - ENABLE_CLAUDEAI_MCP_SERVERS=false
      # Dónde atiende el panel las órdenes «entorno» de los asistentes.
      - PANEL_URL=http://panel:8000${PANEL_PREFIX:-}
    volumes:
      - ./datoov16:/workspace/datoov16
      - ./modulos_github16:/workspace/modulos_github16:ro
      - odoo-dev-homes:/homes
      # Zona de intercambio con el panel: encargos del revisor, compilación de
      # las solicitudes y paso de commits entre los dos repositorios.
      - ./revision:/workspace/revision
      # Secreto compartido con el panel para las ventanas de terminal. Solo
      # root puede leerlo; los puestos no.
      - ./terminal.secret:/run/terminal.secret:ro

  # Túnel de Cloudflare. Las rutas están en ./cloudflared/config.yml.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: odoo-dev-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /home/nonroot/.cloudflared/config.yml run
    volumes:
      - ./cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - web
    mem_limit: 256m

networks:
  control:
    internal: true

volumes:
  odoo-dev-data:
  odoo-dev-pgdata:
  odoo-dev-backups:
  odoo-dev-panel-data:
  odoo-dev-homes:
