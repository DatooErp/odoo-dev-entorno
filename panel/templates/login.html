{% extends "base.html" %}{% block title %}Entrar{% endblock %}
{% block body %}
<div class="card login">
  <h1>{{ env_name }}</h1>
  <p class="lead">Panel de control del entorno.</p>
  <form method="post">
    <label for="user">Perfil</label>
    <select id="user" name="user"><option value="cliente">Cliente</option><option value="datoo">Datoo</option></select>
    <label for="password">Contraseña</label>
    <input id="password" type="password" name="password" autocomplete="current-password" autofocus required>
    <button class="primary">Entrar</button>
  </form>
</div>
{% endblock %}
